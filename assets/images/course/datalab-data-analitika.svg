<svg xmlns="http://www.w3.org/2000/svg" width="710" height="488" viewBox="0 0 710 488" role="img" aria-label="Data Analitika course cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#1D2B7A"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 H 0 V 28" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="710" height="488" fill="url(#bg)"/>
  <rect width="710" height="488" fill="url(#grid)"/>

  <!-- Decorative nodes -->
  <g opacity="0.9">
    <circle cx="96" cy="110" r="6" fill="#7CFFCB"/>
    <circle cx="148" cy="148" r="5" fill="#60A5FA"/>
    <circle cx="196" cy="112" r="4.5" fill="#A78BFA"/>
    <circle cx="232" cy="170" r="4" fill="#FDE68A"/>
    <path d="M96 110 L148 148 L196 112 L232 170" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
  </g>

  <!-- Chart icon -->
  <g transform="translate(430 86)" opacity="0.95">
    <rect x="0" y="0" width="214" height="156" rx="16" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <g transform="translate(22 26)">
      <path d="M0 100 H170" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
      <path d="M0 100 V0" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
      <path d="M14 84 L54 58 L86 72 L124 34 L162 44" fill="none" stroke="#7CFFCB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="14" cy="84" r="5" fill="#7CFFCB"/>
      <circle cx="54" cy="58" r="5" fill="#7CFFCB"/>
      <circle cx="86" cy="72" r="5" fill="#7CFFCB"/>
      <circle cx="124" cy="34" r="5" fill="#7CFFCB"/>
      <circle cx="162" cy="44" r="5" fill="#7CFFCB"/>
    </g>
  </g>

  <!-- Title card -->
  <g filter="url(#shadow)">
    <rect x="52" y="282" width="606" height="150" rx="22" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.18"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial" fill="#FFFFFF">
    <text x="86" y="340" font-size="44" font-weight="800" letter-spacing="0.4">Data Analitika</text>
    <text x="86" y="380" font-size="18" opacity="0.88">Insight, visualization, and real-world tasks</text>
    <g transform="translate(86 402)" opacity="0.9">
      <rect x="0" y="0" width="128" height="34" rx="10" fill="#7CFFCB" fill-opacity="0.14" stroke="#7CFFCB" stroke-opacity="0.35"/>
      <text x="16" y="23" font-size="14" font-weight="700" fill="#D1FAE5">Datalab Academy</text>
    </g>
  </g>
</svg>
