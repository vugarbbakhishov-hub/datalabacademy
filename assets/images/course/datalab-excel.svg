<svg xmlns="http://www.w3.org/2000/svg" width="710" height="488" viewBox="0 0 710 488" role="img" aria-label="Excel course cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1C"/>
      <stop offset="0.5" stop-color="#065F46"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <pattern id="cells" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 H 0 V 24" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
      <path d="M 12 0 V 24" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
      <path d="M 0 12 H 24" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="710" height="488" fill="url(#bg)"/>
  <rect width="710" height="488" fill="url(#cells)"/>

  <!-- Spreadsheet icon -->
  <g transform="translate(420 74)" opacity="0.96">
    <rect x="0" y="0" width="236" height="180" rx="18" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <g transform="translate(26 26)">
      <rect x="0" y="0" width="184" height="128" rx="12" fill="#BBF7D0" fill-opacity="0.10" stroke="#BBF7D0" stroke-opacity="0.38"/>
      <rect x="0" y="0" width="184" height="24" rx="12" fill="#22C55E" fill-opacity="0.22"/>
      <path d="M12 44 H172 M12 68 H172 M12 92 H172" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round"/>
      <path d="M52 28 V128 M96 28 V128 M140 28 V128" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
      <path d="M14 112 L46 88 L76 98 L110 72 L156 82" fill="none" stroke="#FDE68A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Formula pill -->
  <g transform="translate(56 102)" opacity="0.95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <rect x="0" y="0" width="332" height="62" rx="16" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="18" y="40" font-size="18" fill="#E5E7EB" opacity="0.95">=SUM(A2:A12) + IF(B2&gt;0, B2, 0)</text>
  </g>

  <!-- Title card -->
  <g filter="url(#shadow)">
    <rect x="52" y="282" width="606" height="150" rx="22" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.18"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial" fill="#FFFFFF">
    <text x="86" y="340" font-size="44" font-weight="800" letter-spacing="0.4">Excel</text>
    <text x="86" y="380" font-size="18" opacity="0.88">Formulas, Pivot Tables, Power Query, dashboards</text>
    <g transform="translate(86 402)" opacity="0.9">
      <rect x="0" y="0" width="128" height="34" rx="10" fill="#86EFAC" fill-opacity="0.14" stroke="#86EFAC" stroke-opacity="0.35"/>
      <text x="16" y="23" font-size="14" font-weight="700" fill="#DCFCE7">Datalab Academy</text>
    </g>
  </g>
</svg>
