<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="aiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1437"/>
      <stop offset="55%" stop-color="#3b1a78"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="aiGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="aiOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0b1437" stop-opacity="0"/>
    </radialGradient>
    <filter id="aiBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#aiBg)"/>

  <g opacity="0.25" stroke="#a855f7" stroke-width="1" fill="none">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800"/>
    <path d="M100 0 V500 M200 0 V500 M300 0 V500 M400 0 V500 M500 0 V500 M600 0 V500 M700 0 V500"/>
  </g>

  <circle cx="180" cy="220" r="120" fill="url(#aiOrb)" filter="url(#aiBlur)"/>

  <g transform="translate(180 220)">
    <circle r="58" fill="#0b1437" stroke="url(#aiGlow)" stroke-width="3"/>
    <circle r="58" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="58;72;58" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="10" text-anchor="middle" font-family="Inter, Arial, sans-serif"
          font-size="42" font-weight="800" fill="#ffffff" letter-spacing="2">AI</text>
  </g>

  <g stroke="#22d3ee" stroke-width="1.5" fill="#22d3ee" opacity="0.85">
    <line x1="238" y1="220" x2="360" y2="160"/>
    <line x1="238" y1="220" x2="360" y2="280"/>
    <line x1="238" y1="220" x2="360" y2="100"/>
    <line x1="238" y1="220" x2="360" y2="340"/>

    <line x1="360" y1="100" x2="500" y2="120"/>
    <line x1="360" y1="160" x2="500" y2="200"/>
    <line x1="360" y1="280" x2="500" y2="280"/>
    <line x1="360" y1="340" x2="500" y2="360"/>

    <circle cx="360" cy="100" r="6"/>
    <circle cx="360" cy="160" r="6"/>
    <circle cx="360" cy="280" r="6"/>
    <circle cx="360" cy="340" r="6"/>
    <circle cx="500" cy="120" r="7" fill="#a855f7"/>
    <circle cx="500" cy="200" r="7" fill="#a855f7"/>
    <circle cx="500" cy="280" r="7" fill="#a855f7"/>
    <circle cx="500" cy="360" r="7" fill="#a855f7"/>
  </g>

  <g transform="translate(540 70)">
    <rect width="220" height="120" rx="14" fill="#ffffff" opacity="0.08"/>
    <rect width="220" height="120" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#e0f2fe">
      <text x="14" y="30">&gt; prompt:</text>
      <text x="14" y="52" fill="#fde68a">"Analyze this CSV..."</text>
      <text x="14" y="80" fill="#86efac">✓ insight ready</text>
      <text x="14" y="100" fill="#a5b4fc">model: gpt / claude</text>
    </g>
  </g>

  <g transform="translate(540 350)" font-family="Inter, Arial, sans-serif" fill="#ffffff">
    <rect x="-20" y="-30" width="260" height="120" rx="20" fill="#000000" opacity="0.35"/>
    <rect x="-20" y="-30" width="260" height="120" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="0" y="0" font-size="26" font-weight="800">AI ilə Effektiv İş</text>
    <text x="0" y="28" font-size="13" fill="#cbd5e1">Prompt, ChatGPT, Claude · iş axınları</text>
    <g transform="translate(0 50)">
      <rect width="120" height="26" rx="13" fill="#ffffff" opacity="0.18"/>
      <text x="60" y="17" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="600">Datalab Academy</text>
    </g>
  </g>

  <g fill="#fde68a">
    <circle cx="60" cy="60" r="2"/>
    <circle cx="120" cy="420" r="2"/>
    <circle cx="700" cy="40" r="2"/>
    <circle cx="760" cy="460" r="2"/>
    <circle cx="40" cy="340" r="1.5"/>
    <circle cx="780" cy="220" r="1.5"/>
  </g>
</svg>
